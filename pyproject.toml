[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha"
version = "0.1.0"
description = "OmniAlpha: A Sequence-to-Sequence Framework for Unified Multi-Task RGBA Generation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Hao Yu", email = "longinyh@gmail.com" },
]

dependencies = [
    # ---------- Core ML ----------
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "torchmetrics==1.8.2",
    "pytorch-lightning==2.5.5",
    "lightning-utilities==0.15.2",

    # ---------- Transformers / HF ----------
    "transformers==4.57.1",
    "tokenizers==0.22.1",
    "accelerate==1.10.1",
    "peft==0.17.1",
    "trl==0.19.1",
    "datasets==4.1.1",
    "huggingface-hub==0.35.3",
    "safetensors==0.6.2",
    "sentencepiece==0.2.1",
    "hf-xet==1.1.10",

    "diffusers @ git+https://github.com/huggingface/diffusers.git@4c723d8ec318b5fd266afaf14ba37afdefc967df",

    # ---------- Distributed training ----------
    "deepspeed==0.17.6",
    "ninja==1.13.0",

    # ---------- Data processing & vision ----------
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pillow==11.3.0",
    "opencv-python==4.12.0.88",
    "pyarrow==21.0.0",

    # ---------- Config & serialization ----------
    "omegaconf==2.3.0",
    "PyYAML==6.0.3",
    "hjson==3.1.0",
    "json5==0.12.1",
    "Jinja2==3.1.6",

    # ---------- Text / tokenization ----------
    "regex==2025.9.18",
    "ftfy==6.3.1",

    # ---------- Networking ----------
    "requests==2.32.5",
    "aiohttp==3.12.15",
    "httpx==0.28.1",

    # ---------- Utilities ----------
    "einops==0.8.1",
    "tqdm==4.67.1",
    "psutil==7.1.0",
    "packaging==25.0",
    "filelock==3.19.1",
    "dill==0.4.0",
    "pydantic==2.11.9",
    "sympy==1.14.0",
    "networkx==3.4.2",
    "prodigyopt==1.1.2",

    # ---------- Visualization / logging ----------
    "tensorboard==2.20.0",
    "Markdown==3.9",
    "Werkzeug==3.1.3",
    "protobuf==6.32.1",
    "grpcio==1.75.1",
    "absl-py==2.3.1",

    # ---------- GRPO / image quality ----------
    "pyiqa",
    "lpips==0.1.4",
    "piq==0.8.0",

    # ---------- Legacy / special ----------
    "taming-transformers-rom1504==0.0.6",
    "antlr4-python3-runtime==4.9.3",
]

[project.urls]
Repository = "https://github.com/Longin-Yu/OmniAlpha-Private"
Paper = "https://arxiv.org/abs/2511.20211"

[tool.setuptools.packages.find]
include = ["alpha", "alpha.*"]
